<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Ruota Pagine</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-dark text-light p-5">
    <div class="container">
        <h2 class="fw-bold mb-4">Ruota Pagine</h2>

        <div class="tool-card p-4 rounded mb-4">
            <input type="file" id="pdfFile" class="form-control mb-3">
            <input type="text" id="pages" class="form-control mb-3" placeholder="Pagine da ruotare (es: 1, 3-5)">
            <select id="angle" class="form-control mb-3">
                <option value="90">90°</option>
                <option value="180">180°</option>
                <option value="270">270°</option>
            </select>
            <button class="btn btn-warning w-100" onclick="rotatePDF()">Ruota</button>
        </div>
    </div>

    <script src="../libs/pdf-lib.min.js"></script>
    <script src="../js/rotate.js"></script>
</body>
</html>
