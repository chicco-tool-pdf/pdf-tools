<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Watermark</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-dark text-light p-5">
    <div class="container">
        <h2 class="fw-bold mb-4">Watermark PDF</h2>

        <div class="tool-card p-4 rounded mb-4">
            <input type="file" id="pdfFile" class="form-control mb-3">
            <input type="text" id="text" class="form-control mb-3" placeholder="Testo watermark">
            <button class="btn btn-info w-100" onclick="addWatermark()">Applica</button>
        </div>
    </div>

    <script src="../libs/pdf-lib.min.js"></script>
    <script src="../js/watermark.js"></script>
</body>
</html>
