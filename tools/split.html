<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Dividi PDF</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-dark text-light p-5">
    <div class="container">
        <h2 class="fw-bold mb-4">Dividi PDF</h2>

        <div class="tool-card p-4 rounded mb-4">
            <input type="file" id="pdfFile" class="form-control mb-3">
            <input type="text" id="pages" class="form-control mb-3" placeholder="Es: 1-3, 5, 7-9">
            <button class="btn btn-secondary w-100" onclick="splitPDF()">Dividi</button>
        </div>
    </div>

    <script src="../libs/pdf-lib.min.js"></script>
    <script src="../js/split.js"></script>
</body>
</html>
